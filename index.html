<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QR Code Generator - by Hong Quang</title>

    <!-- Apple iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QRCode">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="app_icon.png">

    <!-- QR Code JS Engine (Offline Ready) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-bg: #eff6ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-sec: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            position: relative;
            text-align: center;
            padding: 10px 0 4px 0;
        }

        .lang-toggle {
            position: absolute;
            top: 10px;
            right: 0;
            background: #dbeafe;
            color: var(--primary);
            border: none;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header h1 {
            font-size: 21px;
            font-weight: 800;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
            margin-top: 2px;
        }

        /* 6 Categories Grid */
        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .cat-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .cat-card.active {
            border-color: var(--primary);
            background: var(--primary-bg);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
        }

        .cat-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .cat-card.active .cat-icon {
            background: #dbeafe;
        }

        .cat-info {
            flex: 1;
            min-width: 0;
        }

        .cat-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px;
        }

        .cat-card.active .cat-name {
            color: var(--primary);
        }

        .cat-desc {
            font-size: 10px;
            color: var(--text-sec);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cat-arrow {
            font-size: 12px;
            color: #94a3b8;
        }

        .cat-card.active .cat-arrow {
            color: var(--primary);
        }

        /* Input Form Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 14px;
            background: #f8fafc;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary);
            background: #ffffff;
        }

        .btn-main {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: transform 0.1s, background 0.2s;
        }

        .btn-main:active {
            transform: scale(0.98);
            background: #1d4ed8;
        }

        /* Preview Card */
        .preview-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        #qrcode {
            padding: 12px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 220px;
            min-width: 220px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-save {
            flex: 1;
            background: #16a34a;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            border: none;
            cursor: pointer;
        }

        .btn-share {
            flex: 1;
            background: #eff6ff;
            color: var(--primary);
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            border: 1px solid #bfdbfe;
            cursor: pointer;
        }

        .badge-security {
            background: #f0fdf4;
            color: #166534;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: var(--text-sec);
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="lang-toggle" onclick="toggleLang()" id="btn_lang">🇬🇧 EN</button>
            <h1 id="txt_app_title"><span>📱</span> QR Code Generator</h1>
            <p id="txt_app_subtitle">Created by Hong Quang • Apple iOS Edition</p>
        </div>

        <div class="badge-security">
            <span>🔒</span>
            <span id="txt_security_badge">100% Offline Processing • Chuẩn ISO/IEC 18004</span>
        </div>

        <div>
            <div class="section-title" id="txt_cat_title">Chọn loại mã QR:</div>
            <div class="categories-grid" id="cat_grid">
                <!-- Injected categories -->
            </div>
        </div>

        <div class="card" id="form-container">
            <!-- Dynamic Form will be injected here -->
        </div>

        <div class="card preview-card">
            <div id="qrcode"></div>
            <div class="btn-row">
                <button class="btn-save" id="btn_save" onclick="saveQRCode()">💾 Lưu ảnh (Save)</button>
                <button class="btn-share" id="btn_share" onclick="shareQRCode()">📤 Chia sẻ (Share)</button>
            </div>
        </div>

        <div class="footer" id="txt_footer">
            ✨ Created with ❤️ by <strong>Hong Quang</strong><br>
            Tương thích iPhone, iPad, Android & Windows
        </div>
    </div>

    <script>
        let currentLang = 'vi';
        let currentCat = 'url';
        let qrcodeObj = null;

        const i18n = {
            vi: {
                lang_btn: '🇬🇧 EN',
                app_title: '📱 Trình tạo mã QR',
                app_subtitle: 'Được tạo bởi Hong Quang • Bản Apple iOS',
                sec_badge: '100% Xử lý ngoại tuyến • Chuẩn ISO/IEC 18004',
                cat_title: 'Chọn loại mã QR:',
                btn_gen: '⚡ TẠO MÃ QR',
                btn_save: '💾 Lưu ảnh (Save)',
                btn_share: '📤 Chia sẻ (Share)',
                footer: '✨ Được tạo bởi <strong>Hong Quang</strong><br>Tương thích iPhone, iPad, Android & Windows',
                empty_msg: 'Vui lòng nhập đầy đủ thông tin!',
                cats: [
                    { id: 'url', icon: '🌐', name: 'URL', desc: 'Mở trang web' },
                    { id: 'phone', icon: '📞', name: 'Điện thoại', desc: 'Gọi số điện thoại' },
                    { id: 'wifi', icon: '📶', name: 'Wi-Fi', desc: 'Kết nối Wi-Fi' },
                    { id: 'email', icon: '✉️', name: 'E-mail', desc: 'Bản thảo email' },
                    { id: 'pdf', icon: '📄', name: 'PDF', desc: 'Chia sẻ PDF' },
                    { id: 'text', icon: 'Aa', name: 'Văn bản', desc: 'Thông điệp tùy chỉnh' }
                ],
                forms: {
                    url_lbl: '🌐 Nhập Website URL:',
                    phone_lbl: '📞 Nhập Số điện thoại:',
                    wifi_ssid: '📶 Tên Wi-Fi (SSID):',
                    wifi_sec: 'Loại bảo mật:',
                    wifi_opt_pass: 'Có mật khẩu (WPA/WPA2/WPA3)',
                    wifi_opt_open: 'Không có mật khẩu (Open / Mạng mở)',
                    wifi_pass: 'Mật khẩu Wi-Fi:',
                    email_to: '✉️ Email người nhận:',
                    email_sub: 'Tiêu đề thư:',
                    email_body: 'Nội dung thư:',
                    pdf_lbl: '📄 Link file PDF / Google Drive:',
                    text_lbl: '📝 Nhập nội dung văn bản:'
                }
            },
            en: {
                lang_btn: '🇻🇳 VI',
                app_title: '📱 QR Code Generator',
                app_subtitle: 'Created by Hong Quang • Apple iOS Edition',
                sec_badge: '100% Offline Processing • ISO/IEC 18004 Compliant',
                cat_title: 'Select QR Code Type:',
                btn_gen: '⚡ GENERATE QR CODE',
                btn_save: '💾 Save Image',
                btn_share: '📤 Share',
                footer: '✨ Created with ❤️ by <strong>Hong Quang</strong><br>Compatible with iPhone, iPad, Android & Windows',
                empty_msg: 'Please fill in all details!',
                cats: [
                    { id: 'url', icon: '🌐', name: 'URL', desc: 'Open website' },
                    { id: 'phone', icon: '📞', name: 'Phone', desc: 'Dial phone number' },
                    { id: 'wifi', icon: '📶', name: 'Wi-Fi', desc: 'Join Wi-Fi network' },
                    { id: 'email', icon: '✉️', name: 'E-mail', desc: 'Compose email' },
                    { id: 'pdf', icon: '📄', name: 'PDF', desc: 'Share PDF/file' },
                    { id: 'text', icon: 'Aa', name: 'Plain Text', desc: 'Custom message' }
                ],
                forms: {
                    url_lbl: '🌐 Enter Website Link (URL):',
                    phone_lbl: '📞 Enter Phone Number:',
                    wifi_ssid: '📶 Wi-Fi Name (SSID):',
                    wifi_sec: 'Security Type:',
                    wifi_opt_pass: 'Password Protected (WPA/WPA2/WPA3)',
                    wifi_opt_open: 'No Password (Open Network)',
                    wifi_pass: 'Wi-Fi Password:',
                    email_to: '✉️ Recipient Email:',
                    email_sub: 'Subject:',
                    email_body: 'Message Body:',
                    pdf_lbl: '📄 PDF / Google Drive Link:',
                    text_lbl: '📝 Custom Text Message:'
                }
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'vi' ? 'en' : 'vi';
            updateUIStrings();
        }

        function updateUIStrings() {
            const t = i18n[currentLang];
            document.getElementById('btn_lang').innerText = t.lang_btn;
            document.getElementById('txt_app_title').innerHTML = `<span>📱</span> ${t.app_title.replace('📱 ', '')}`;
            document.getElementById('txt_app_subtitle').innerText = t.app_subtitle;
            document.getElementById('txt_security_badge').innerText = t.sec_badge;
            document.getElementById('txt_cat_title').innerText = t.cat_title;
            document.getElementById('btn_save').innerText = t.btn_save;
            document.getElementById('btn_share').innerText = t.btn_share;
            document.getElementById('txt_footer').innerHTML = t.footer;

            renderCategories();
            renderForm();
        }

        function renderCategories() {
            const grid = document.getElementById('cat_grid');
            const cats = i18n[currentLang].cats;
            grid.innerHTML = cats.map(c => `
                <div class="cat-card ${c.id === currentCat ? 'active' : ''}" onclick="selectCategory('${c.id}')">
                    <div class="cat-icon">${c.icon}</div>
                    <div class="cat-info">
                        <div class="cat-name">${c.name}</div>
                        <div class="cat-desc">${c.desc}</div>
                    </div>
                    <div class="cat-arrow">➔</div>
                </div>
            `).join('');
        }

        function selectCategory(cat) {
            currentCat = cat;
            renderCategories();
            renderForm();
        }

        function renderForm() {
            const container = document.getElementById('form-container');
            const f = i18n[currentLang].forms;
            const btnText = i18n[currentLang].btn_gen;

            if (currentCat === 'url') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>${f.url_lbl}</label>
                        <input type="url" id="inp_url" value="https://" placeholder="https://example.com">
                    </div>
                    <button class="btn-main" onclick="generateQR()">${btnText}</button>
                `;
            } else if (currentCat === 'phone') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>${f.phone_lbl}</label>
                        <input type="tel" id="inp_phone" placeholder="0912345678...">
                    </div>
                    <button class="btn-main" onclick="generateQR()">${btnText}</button>
                `;
            } else if (currentCat === 'wifi') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>${f.wifi_ssid}</label>
                        <input type="text" id="inp_wifi_ssid" placeholder="VD: MyHome-WiFi">
                    </div>
                    <div class="form-group">
                        <label>${f.wifi_sec}</label>
                        <select id="inp_wifi_sec" onchange="toggleWifiPass()">
                            <option value="WPA">${f.wifi_opt_pass}</option>
                            <option value="nopass">${f.wifi_opt_open}</option>
                            <option value="WEP">WEP</option>
                        </select>
                    </div>
                    <div class="form-group" id="wifi_pass_group">
                        <label>${f.wifi_pass}</label>
                        <input type="password" id="inp_wifi_pass" placeholder="Password...">
                    </div>
                    <button class="btn-main" onclick="generateQR()">${btnText}</button>
                `;
            } else if (currentCat === 'email') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>${f.email_to}</label>
                        <input type="email" id="inp_email_to" placeholder="contact@example.com">
                    </div>
                    <div class="form-group">
                        <label>${f.email_sub}</label>
                        <input type="text" id="inp_email_sub" placeholder="...">
                    </div>
                    <div class="form-group">
                        <label>${f.email_body}</label>
                        <input type="text" id="inp_email_body" placeholder="...">
                    </div>
                    <button class="btn-main" onclick="generateQR()">${btnText}</button>
                `;
            } else if (currentCat === 'pdf') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>${f.pdf_lbl}</label>
                        <input type="url" id="inp_pdf" value="https://drive.google.com/" placeholder="https://...">
                    </div>
                    <button class="btn-main" onclick="generateQR()">${btnText}</button>
                `;
            } else if (currentCat === 'text') {
                container.innerHTML = `
                    <div class="form-group">
                        <label>${f.text_lbl}</label>
                        <textarea id="inp_text" rows="3" placeholder="..."></textarea>
                    </div>
                    <button class="btn-main" onclick="generateQR()">${btnText}</button>
                `;
            }
        }

        function toggleWifiPass() {
            const sec = document.getElementById('inp_wifi_sec').value;
            const passGroup = document.getElementById('wifi_pass_group');
            if (sec === 'nopass') {
                passGroup.style.display = 'none';
            } else {
                passGroup.style.display = 'flex';
            }
        }

        function getPayload() {
            if (currentCat === 'url') {
                return document.getElementById('inp_url').value.trim();
            } else if (currentCat === 'phone') {
                const p = document.getElementById('inp_phone').value.trim().replace(/[\s-]/g, '');
                return p ? `tel:${p}` : '';
            } else if (currentCat === 'wifi') {
                const ssid = document.getElementById('inp_wifi_ssid').value.trim();
                const sec = document.getElementById('inp_wifi_sec').value;
                const pass = document.getElementById('inp_wifi_pass') ? document.getElementById('inp_wifi_pass').value : '';
                if (!ssid) return '';
                return sec === 'nopass' ? `WIFI:T:nopass;S:${ssid};;` : `WIFI:T:${sec};S:${ssid};P:${pass};;`;
            } else if (currentCat === 'email') {
                const to = document.getElementById('inp_email_to').value.trim();
                const sub = encodeURIComponent(document.getElementById('inp_email_sub').value.trim());
                const body = encodeURIComponent(document.getElementById('inp_email_body').value.trim());
                return to ? `mailto:${to}?subject=${sub}&body=${body}` : '';
            } else if (currentCat === 'pdf') {
                return document.getElementById('inp_pdf').value.trim();
            } else if (currentCat === 'text') {
                return document.getElementById('inp_text').value.trim();
            }
            return '';
        }

        function generateQR() {
            const payload = getPayload();
            if (!payload) {
                alert(i18n[currentLang].empty_msg);
                return;
            }

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            qrcodeObj = new QRCode(qrContainer, {
                text: payload,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function saveQRCode() {
            const img = document.querySelector('#qrcode img');
            if (img && img.src) {
                const a = document.createElement('a');
                a.href = img.src;
                a.download = 'qrcode.png';
                a.click();
            } else {
                alert(i18n[currentLang].empty_msg);
            }
        }

        function shareQRCode() {
            if (navigator.share) {
                const payload = getPayload();
                navigator.share({
                    title: 'QR Code Generator',
                    text: 'Mã QR tạo bởi Hong Quang',
                    url: payload || window.location.href
                }).catch(() => {});
            } else {
                alert('Saved directly!');
            }
        }

        // Initialize
        updateUIStrings();
        setTimeout(() => {
            generateQR();
        }, 300);
    </script>
</body>
</html>
